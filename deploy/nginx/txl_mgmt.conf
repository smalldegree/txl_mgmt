# 通讯录管理系统 Nginx 站点配置
# 部署方式：include 方式（将本文件放入 /etc/nginx/conf.d/ 或 sites-available）
# 域名：ecs.fuxi.space   端口：14200（HTTPS）
# 说明：前端静态文件由 Nginx 托管，/api、/admin 反向代理到 gunicorn（127.0.0.1:8000）

upstream txl_mgmt_backend {
    server 127.0.0.1:8000;
}

server {
    listen 14200 ssl http2;
    listen [::]:14200 ssl http2;
    server_name ecs.fuxi.space;

    # 前端静态文件（Vue 构建产物）
    root /var/www/txl_mgmt/frontend/dist;
    index index.html;

    # 前端 SPA（history 路由回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 RESTful API
    location /api/ {
        proxy_pass http://txl_mgmt_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django admin 后台
    location /admin/ {
        proxy_pass http://txl_mgmt_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django 静态文件（collectstatic 产物）
    location /static/ {
        alias /var/www/txl_mgmt/backend/staticfiles/;
    }

    # 媒体文件
    location /media/ {
        alias /var/www/txl_mgmt/backend/media/;
    }
}
